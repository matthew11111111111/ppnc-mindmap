              lessonHeights.push(LESSON_MIN_H);

          // Total height needed for this whole branch

              raw: lesson,

              dir: dir,
              children: []

              const startLeafY = lessonY - leavesSpan / 2;

                const subY = startLeafY + sIdx * LEAF_HEIGHT;

                lessonLayout.children.push({

                  x: subX,
                  y: subY,

              });
            }

            branchLayout.children.push(lessonLayout);
            currentY += h + LESSON_GAP; // Advance currentY strictly beyond this lesson block!
          });
        }

        layoutData.children.push(branchLayout);
      });

      drawHierarchy(layoutData, linksLayer, nodesLayer);
      drawCrossTopicBridges(crossLayer);
    }


    // DRAW CROSS-TOPIC METHODOLOGICAL BRIDGES (SỰ LIÊN KẾT LIÊN BÀI VÀ NỀN TẢNG)
    function drawCrossTopicBridges(layer) {
      if (!layer) return;
      layer.innerHTML = "";
      if (!showBridges) return;

      crossTopicBridges.forEach((bridge, idx) => {
        const fromNode = nodeCoordinates[bridge.from];
        const toNode = nodeCoordinates[bridge.to];
        if (!fromNode || !toNode) return;

        // Draw graceful organic dashed curve between nodes
        const dx = toNode.x - fromNode.x;
        const dy = toNode.y - fromNode.y;
        const cx1 = fromNode.x + dx * 0.25;
        const cy1 = fromNode.y + dy * 0.85 + (idx % 2 === 0 ? 35 : -35);
        const cx2 = fromNode.x + dx * 0.75;
        const cy2 = toNode.y - dy * 0.25;

        const pathStr = `M ${fromNode.x} ${fromNode.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${toNode.x} ${toNode.y}`;

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "cursor-pointer group");
        g.onclick = (e) => {
          e.stopPropagation();
          openNodeDetail(bridge.to);
        };

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathStr);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", bridge.color || "#f59e0b");
        path.setAttribute("stroke-width", "2.2");
        path.setAttribute("class", "cross-link-path");
        path.setAttribute("marker-end", `url(#${bridge.marker || 'arrow-gold'})`);
        path.setAttribute("opacity", "0.75");

        // Interactive badge along the bridge curve
        const midX = (fromNode.x + toNode.x) / 2;
        const midY = (fromNode.y + toNode.y) / 2 + (idx % 2 === 0 ? 25 : -25);
        const labelW = bridge.label.length * 6.5 + 24;

        const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bg.setAttribute("x", midX - labelW / 2);
        bg.setAttribute("y", midY - 11);
        bg.setAttribute("width", labelW);
        bg.setAttribute("height", 22);
        bg.setAttribute("rx", 7);
        bg.setAttribute("fill", "#090d16");
        bg.setAttribute("stroke", bridge.color || "#f59e0b");
        bg.setAttribute("stroke-width", "1.2");
        bg.setAttribute("class", "shadow-lg");

        const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txt.setAttribute("x", midX);
        txt.setAttribute("y", midY + 4);
        txt.setAttribute("fill", bridge.color || "#fbbf24");
        txt.setAttribute("font-size", "9.5");
        txt.setAttribute("font-weight", "700");
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("font-family", "'Plus Jakarta Sans', sans-serif");
        txt.textContent = "⚡ " + bridge.label;

        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = bridge.desc;

        g.appendChild(path);
        g.appendChild(bg);
        g.appendChild(txt);
        g.appendChild(title);
        layer.appendChild(g);
      });
    }

    function drawHierarchy(node, linksLayer, nodesLayer) {
      if (node.children) {
        node.children.forEach(child => {
          // Organic curved tree branch (Cubic Bezier)
          const dx = child.x - node.x;
          const cp1x = node.x + dx * 0.48;
          const cp1y = node.y;
          const cp2x = node.x + dx * 0.52;
          const cp2y = child.y;

          const pathStr = `M ${node.x} ${node.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${child.x} ${child.y}`;
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", pathStr);
          path.setAttribute("fill", "none");

          if (child.isBranch) {
            // Main trunk from root: Thick glowing tree trunk
            path.setAttribute("stroke", child.color || "#3b82f6");
            path.setAttribute("stroke-width", "5");
            path.setAttribute("class", "tree-branch-main");
          } else if (child.isLeaf) {

            path.setAttribute("stroke", child.color || "#475569");
            path.setAttribute("stroke-width", "2");

    // PAN & ZOOM HANDLING WITH ZOOM-TO-POINTER AND TOUCH SUPPORT
    function setupPanZoomEvents() {
      const viewport = document.getElementById("mindmap-viewport");
      const content = document.getElementById("mindmap-content");

      // Mouse Dragging
      viewport.addEventListener("mousedown", (e) => {
        // Only left click or middle click
        if (e.button !== 0 && e.button !== 1) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.style.cursor = "grabbing";
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener("mouseup", () => {
        if (isDragging) {
          isDragging = false;
          viewport.style.cursor = "grab";
        }
      });

      // Mouse Wheel Zoom (Pinch-to-zoom & Wheel) centered on cursor
      viewport.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
        const newZoom = Math.max(0.25, Math.min(3.0, zoomLevel * zoomFactor));

        if (newZoom !== zoomLevel) {
          // Adjust pan so the point under cursor remains stationary
          panX = mouseX - (mouseX - panX) * (newZoom / zoomLevel);
          panY = mouseY - (mouseY - panY) * (newZoom / zoomLevel);
          zoomLevel = newZoom;
          updateTransform();
        }
      }, { passive: false });

      // Touch gestures for mobile/tablets
      let touchStartDist = 0;
      let initialZoom = 1;
      viewport.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX - panX;
          startY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialZoom = zoomLevel;
        }
      }, { passive: false });

      viewport.addEventListener("touchmove", (e) => {
        if (isDragging && e.touches.length === 1) {
          panX = e.touches[0].clientX - startX;
          panY = e.touches[0].clientY - startY;
          updateTransform();
        } else if (e.touches.length === 2 && touchStartDist > 0) {
          e.preventDefault();
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          zoomLevel = Math.max(0.25, Math.min(3.0, initialZoom * (dist / touchStartDist)));
          updateTransform();
        }
      }, { passive: false });

      viewport.addEventListener("touchend", () => {
        isDragging = false;
      });

      window.addEventListener("resize", () => {
        // Maintain center if initial load
      });
    }

    function zoomMindmap(factor) {
      const container = document.getElementById("canvas-container");
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || (window.innerHeight - 56);
      const cx = w / 2;
      const cy = h / 2;

      const newZoom = Math.max(0.25, Math.min(3.0, zoomLevel * factor));
      panX = cx - (cx - panX) * (newZoom / zoomLevel);
      panY = cy - (cy - panY) * (newZoom / zoomLevel);
      zoomLevel = newZoom;
      updateTransform();
    }

    function resetZoom() {
      const container = document.getElementById("canvas-container");
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || (window.innerHeight - 56);
      panX = Math.round(w / 2);
      panY = Math.round(h / 2);
      zoomLevel = (w < 1200) ? 0.32 : 0.40;
      updateTransform();
    }

    function updateTransform() {
      document.getElementById("mindmap-content").setAttribute(
        "transform",
        `translate(${panX}, ${panY}) scale(${zoomLevel})`
      );
    }


    // QUICK BRANCH FOCUSING
    function focusBranch(mode) {
      const container = document.getElementById("canvas-container");
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || (window.innerHeight - 56);

      if (mode === 'left') {
        // Focus on Process/Proposal branch (left side)
        panX = Math.round(w * 0.75);
        panY = Math.round(h * 0.5);
        zoomLevel = 0.70;
      } else if (mode === 'right') {
        // Focus on Causal Inference branch (right side)
        panX = Math.round(w * 0.25);
        panY = Math.round(h * 0.5);
        zoomLevel = 0.70;
      } else {
        // Center view
        panX = Math.round(w / 2);
        panY = Math.round(h / 2);
        zoomLevel = 0.56;
      }
      updateTransform();
    }

    // SEARCH SUGGESTIONS & AUTO-FOCUS
    function setupSmartSearch() {
      const searchInput = document.getElementById("nodeSearch");
      const dropdown = document.getElementById("searchResultsDropdown");
      const clearBtn = document.getElementById("clearSearchBtn");

      if (!searchInput || !dropdown) return;

      // Build flat searchable index
      const searchableNodes = [];
      function crawl(n, pName = "") {
        searchableNodes.push({
          id: n.id,
          name: n.name,
          parent: pName,
          summary: n.summary || n.desc || "",
          badge: n.badge || ""
        });
        if (n.children) {
          n.children.forEach(c => crawl(c, n.name));
        }
      }
      crawl(mindmapData);

      searchInput.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) {
          dropdown.classList.add("hidden");
          dropdown.innerHTML = "";
          clearBtn.classList.add("hidden");
          return;
        }

        clearBtn.classList.remove("hidden");
        const results = searchableNodes.filter(item => 
          item.name.toLowerCase().includes(query) || 
          item.summary.toLowerCase().includes(query)
        ).slice(0, 8);

        if (results.length === 0) {
          dropdown.innerHTML = `<div class="p-3 text-slate-400 text-center">Không tìm thấy kết quả phù hợp</div>`;
          dropdown.classList.remove("hidden");
          return;
        }

        dropdown.innerHTML = results.map(r => `
          <div onclick="selectSearchResult('${r.id}')" class="p-2.5 hover:bg-blue-900/40 cursor-pointer flex items-center justify-between transition group">
            <div class="truncate pr-2">
              <div class="font-bold text-slate-200 group-hover:text-blue-300 truncate">${r.name}</div>
              <div class="text-[10px] text-slate-400 truncate">${r.parent ? 'Nhánh: ' + r.parent : 'Gốc môn học'}</div>
            </div>
            <span class="text-[9px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full border border-slate-700 shrink-0">Mở ➔</span>
          </div>
        `).join('');
        dropdown.classList.remove("hidden");
      });

      // Close dropdown when clicking outside
      document.addEventListener("click", (e) => {
        if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add("hidden");
        }
      });
    }

    function selectSearchResult(nodeId) {
      document.getElementById("searchResultsDropdown").classList.add("hidden");
      openNodeDetail(nodeId);

      // Smoothly pan camera towards this node
      const coord = nodeCoordinates[nodeId];
      if (coord) {
        const container = document.getElementById("canvas-container");
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || (window.innerHeight - 56);
        zoomLevel = Math.max(0.75, zoomLevel);
        panX = Math.round(w / 2 - coord.x * zoomLevel);
        panY = Math.round(h / 2 - coord.y * zoomLevel);
        updateTransform();
      }
    }

    function clearSearch() {
      const searchInput = document.getElementById("nodeSearch");
      searchInput.value = "";
      document.getElementById("searchResultsDropdown").classList.add("hidden");
      document.getElementById("clearSearchBtn").classList.add("hidden");
      searchInput.focus();
    }


    // VIEW SWITCHER
    function switchView(viewName) {
      if (viewName === 'mindmap') {
        closeSidebar();
      }
    }

    // INITIALIZATION
    window.addEventListener("DOMContentLoaded", () => {
      initMindmap();
    });

  </script>
</body>
</html>
